{% extends "base.html" %}
{% block title %}Login | DRISKA{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="eyebrow">WELCOME BACK</div>
        <h1>Login to DRISKA</h1>
        <p>Access your dashboard and saved risk analyses.</p>
        <form method="POST" class="form">
            <label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
            <label>Password<input type="password" name="password" required placeholder="••••••••"></label>
            <button class="primary-btn full" type="submit">Login →</button>
        </form>
        <p class="form-bottom">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
